name: Build and Release

# Reproducible contract build + release for stellar.expert source verification.
# Deployments meant to show as "verified" on the explorer must use the wasm
# attached to the GitHub release produced by this workflow, not a local build.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Tickie ticket-registry contract release"
      relative_path: '["contracts/ticket-registry"]'
      package: "ticket-registry"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
